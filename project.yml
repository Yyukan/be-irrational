name: BeIrrational

options:
  bundleIdPrefix: net.shtykhno
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    # no separate BeIrrational.debug.dylib (and none of its console noise when run from Xcode)
    ENABLE_DEBUG_DYLIB: NO

targets:
  BeIrrational:
    type: application
    platform: iOS
    sources:
      - path: BeIrrational
        excludes:
          - "Info.plist"
          - "Tests"
          - "UITests"
    settings:
      base:
        PRODUCT_NAME: BeIrrational
        PRODUCT_BUNDLE_IDENTIFIER: net.shtykhno.BeIrrational
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BeIrrational/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # the existing App Store record (id 483434584) owns this bundle id; the team is the
        # certificate's OU, not the bracketed id after the name
        DEVELOPMENT_TEAM: G6LUHT349V
    info:
      path: BeIrrational/Info.plist
      properties:
        CFBundleDisplayName: Be Irrational
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - arm64
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  BeIrrationalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BeIrrational/Tests
        excludes:
          - "Fixtures"
      - path: BeIrrational/Tests/Fixtures
        type: folder
    dependencies:
      - target: BeIrrational
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shtykhno.BeIrrational.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: G6LUHT349V

  BeIrrationalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BeIrrational/UITests
    dependencies:
      - target: BeIrrational
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shtykhno.BeIrrational.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BeIrrational
        DEVELOPMENT_TEAM: G6LUHT349V

schemes:
  BeIrrational:
    build:
      targets:
        BeIrrational: all
        BeIrrationalTests: [test]
        BeIrrationalUITests: [test]
    run:
      config: Release
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - BeIrrationalTests
        - BeIrrationalUITests
